<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriTrack AI - 智慧 TDEE 與熱量追蹤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-24 selection:bg-brand-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 glass-card border-b border-slate-800/80 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-bolt text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">NutriTrack AI</h1>
                <p class="text-[10px] text-slate-400" id="currentDateDisplay">載入日期中...</p>
            </div>
        </div>
        <button onclick="openModal('customGoalModal')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-emerald-400 border border-emerald-500/30 transition flex items-center space-x-1">
            <i class="fa-solid fa-sliders text-[10px]"></i>
            <span>自訂目標</span>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- 分頁 1：今日追蹤 -->
        <section id="tab-today" class="space-y-6 tab-content">
            <!-- 儀表板卡片 -->
            <div class="glass-card rounded-2xl p-5 relative overflow-hidden shadow-xl">
                <div class="absolute -right-10 -bottom-10 w-36 h-36 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span id="goalBadge" class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">維持體重</span>
                        <h2 class="text-xs text-slate-400 mt-1.5">今日熱量剩餘</h2>
                    </div>
                    <button onclick="switchTab('settings')" class="text-slate-400 hover:text-white text-xs flex items-center space-x-1 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
                        <i class="fa-solid fa-gear"></i>
                        <span>TDEE 設定</span>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4 items-center">
                    <div class="relative flex flex-col items-center justify-center">
                        <div class="text-3xl font-extrabold tracking-tight text-white" id="statRemaining">--</div>
                        <div class="text-xs text-slate-400 mt-0.5">大卡剩餘</div>
                        <div class="text-[10px] text-slate-500 mt-1">目標: <span id="statTarget">--</span> kcal</div>
                    </div>
                    <div class="space-y-3 border-l border-slate-700/60 pl-4">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-slate-400">攝取熱量</span>
                                <span class="font-semibold text-white"><span id="statConsumed">0</span> kcal</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div id="calorieBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="text-slate-400">蛋白質</span>
                                <span class="font-semibold text-white"><span id="statProtein">0</span> / <span id="statProteinTarget">--</span>g</span>
                            </div>
                            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div id="proteinBar" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gemini AI 分析卡片 -->
            <div class="glass-card rounded-2xl p-5 border border-emerald-500/20 bg-gradient-to-b from-slate-900/90 to-emerald-950/20 shadow-lg space-y-3">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                    </div>
                    <h3 class="font-semibold text-sm text-white">Gemini 智慧飲食分析</h3>
                </div>
                
                <textarea id="aiDescription" rows="2" placeholder="輸入食物名稱或描述（如：牛肉麵一碗、雞排特餐）..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
                
                <div class="flex items-center gap-2">
                    <label class="flex-1 cursor-pointer bg-slate-800 hover:bg-slate-700/80 border border-slate-700 rounded-xl py-2 px-3 text-xs text-slate-300 flex items-center justify-center space-x-2 transition">
                        <i class="fa-solid fa-camera text-emerald-400"></i>
                        <span id="photoLabel">拍照 / 上傳食物</span>
                        <input type="file" id="aiImageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                    </label>
                    <button onclick="analyzeFoodWithAI()" id="aiAnalyzeBtn" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-slate-950 font-bold py-2 px-4 rounded-xl text-xs transition shadow-md shadow-emerald-500/20 flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-bolt"></i>
                        <span>AI 計算熱量</span>
                    </button>
                </div>
                
                <div id="imagePreviewContainer" class="hidden relative mt-2 rounded-xl overflow-hidden border border-slate-700 max-h-40">
                    <img id="imagePreview" class="w-full object-cover max-h-40">
                    <button onclick="clearImage()" class="absolute top-2 right-2 bg-slate-900/80 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition">×</button>
                </div>
            </div>

            <!-- 常用食物 -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-sm text-white flex items-center space-x-2">
                        <i class="fa-solid fa-heart text-rose-500"></i>
                        <span>常用食物（我的最愛）</span>
                    </h3>
                </div>
                <div id="favoritesListContainer" class="flex gap-2.5 overflow-x-auto pb-2 hide-scrollbar"></div>
            </div>

            <!-- 今日紀錄 -->
            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-sm text-white">今日飲食紀錄</h3>
                    <span class="text-xs text-slate-400" id="todayLogCount">0 項</span>
                </div>
                <div id="todayFoodLogs" class="space-y-2.5"></div>
            </div>
        </section>

        <!-- 分頁 2：歷史趨勢 -->
        <section id="tab-history" class="space-y-6 tab-content hidden">
            <div class="glass-card rounded-2xl p-5 space-y-4">
                <h3 class="font-bold text-sm text-white flex items-center space-x-2">
                    <i class="fa-solid fa-chart-line text-emerald-400"></i>
                    <span>最近 7 天熱量攝取趨勢</span>
                </h3>
                <div class="relative h-60 w-full">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>
            <div class="glass-card rounded-2xl p-4 space-y-3">
                <h3 class="font-bold text-sm text-white">歷史數據紀錄</h3>
                <div id="historyList" class="space-y-2"></div>
            </div>
        </section>

        <!-- 分頁 3：設定 -->
        <section id="tab-settings" class="space-y-6 tab-content hidden">
            <div class="glass-card rounded-2xl p-5 space-y-4">
                <h3 class="font-bold text-sm text-white flex items-center space-x-2">
                    <i class="fa-solid fa-calculator text-emerald-400"></i>
                    <span>TDEE 與熱量目標計算</span>
                </h3>
                <div class="space-y-3 text-xs">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 mb-1">性別</label>
                            <select id="setGender" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                                <option value="male">男性</option>
                                <option value="female">女性</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">年齡 (歲)</label>
                            <input type="number" id="setAge" value="25" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-400 mb-1">體重 (kg)</label>
                            <input type="number" id="setWeight" value="65" step="0.1" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1">身高 (cm)</label>
                            <input type="number" id="setHeight" value="175" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">活動量</label>
                        <select id="setActivity" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                            <option value="1.2">久坐不動</option>
                            <option value="1.375">輕度運動 (1-3天/周)</option>
                            <option value="1.55" selected>中度運動 (3-5天/周)</option>
                            <option value="1.725">高度運動 (6-7天/周)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">目標設定</label>
                        <select id="setGoalType" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
                            <option value="cut">減脂 (-400 kcal)</option>
                            <option value="maintain" selected>維持體重 (TDEE)</option>
                            <option value="bulk">增肌 (+300 kcal)</option>
                        </select>
                    </div>
                    <button onclick="saveSettings()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold py-3 rounded-xl transition shadow-md shadow-emerald-500/20 mt-3">
                        儲存並更新計算
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-card border-t border-slate-800 px-6 py-2 flex justify-around items-center z-40">
        <button onclick="switchTab('today')" id="nav-btn-today" class="flex flex-col items-center space-y-1 text-emerald-400 transition">
            <i class="fa-solid fa-utensils text-lg"></i>
            <span class="text-[10px] font-medium">記錄追蹤</span>
        </button>
        <button onclick="switchTab('history')" id="nav-btn-history" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-chart-pie text-lg"></i>
            <span class="text-[10px] font-medium">歷史趨勢</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-btn-settings" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200 transition">
            <i class="fa-solid fa-user-gear text-lg"></i>
            <span class="text-[10px] font-medium">TDEE設定</span>
        </button>
    </nav>

    <!-- Modal 彈窗 -->
    <div id="aiResultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-5 space-y-4 border border-slate-700 shadow-2xl">
            <h3 class="font-bold text-sm text-emerald-400 flex items-center space-x-2">
                <i class="fa-solid fa-sparkles"></i>
                <span>AI 辨識結果</span>
            </h3>
            <div id="aiResultContent" class="space-y-2"></div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeModal('aiResultModal')" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-xl text-xs">取消</button>
                <button onclick="confirmAddAIFood()" class="flex-1 bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs">加入紀錄</button>
            </div>
        </div>
    </div>

    <!-- 腳本區塊 -->
    <script>
        // 請將下方引號內的文字替換為您的 Gemini API 金鑰
        const GEMINI_API_KEY = "Ab8RN6IV7phn7tRNXF_VjzLz8RwLMW04o5KLZT3q-o-swk0Vg";⁠

        let state = {
            settings: { gender: 'male', age: 25, weight: 65, height: 175, activity: 1.55, goalType: 'maintain', targetCalories: 2000, targetProtein: 130, goalName: '維持體重' },
            logs: {},
            favorites: [
                { name: '水煮雞胸肉 (100g)', calories: 165, protein: 31 },
                { name: '白飯 (1碗)', calories: 280, protein: 5 },
                { name: '水煮蛋 (1顆)', calories: 75, protein: 6 }
            ],
            currentImageBase64: null,
            pendingAIFood: null
        };

        const todayKey = new Date().toISOString().split('T')[0];

        window.onload = function() {
            loadFromStorage();
            document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
            renderUI();
        };

        function loadFromStorage() {
            const saved = localStorage.getItem('nutritrack_state_v3');
            if (saved) { try { state = JSON.parse(saved); } catch(e){} }
            if (!state.logs[todayKey]) state.logs[todayKey] = [];
        }
        function saveToStorage() { localStorage.setItem('nutritrack_state_v3', JSON.stringify(state)); }

        function switchTab(tId) {
            ['today', 'history', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-btn-${t}`).classList.replace('text-emerald-400', 'text-slate-400');
            });
            document.getElementById(`tab-${tId}`).classList.remove('hidden');
            document.getElementById(`nav-btn-${tId}`).classList.replace('text-slate-400', 'text-emerald-400');
            if(tId === 'history') renderHistoryChart();
        }

        function renderUI() {
            const todayLogs = state.logs[todayKey] || [];
            let consumedCal = todayLogs.reduce((s, i) => s + i.calories, 0);
            let consumedPro = todayLogs.reduce((s, i) => s + i.protein, 0);
            let targetCal = state.settings.targetCalories || 2000;
            let targetPro = state.settings.targetProtein || 130;

            document.getElementById('statRemaining').innerText = targetCal - consumedCal;
            document.getElementById('statTarget').innerText = targetCal;
            document.getElementById('statConsumed').innerText = consumedCal;
            document.getElementById('statProtein').innerText = consumedPro;
            document.getElementById('statProteinTarget').innerText = targetPro;
            document.getElementById('goalBadge').innerText = state.settings.goalName;

            document.getElementById('calorieBar').style.width = Math.min((consumedCal/targetCal)*100, 100) + '%';
            document.getElementById('proteinBar').style.width = Math.min((consumedPro/targetPro)*100, 100) + '%';

            let logHTML = todayLogs.length === 0 ? `<div class="text-center py-6 text-slate-500 text-xs">尚無飲食紀錄</div>` :
                todayLogs.map((item, idx) => `
                    <div class="glass-card rounded-xl p-3 flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-white">${item.name}</div>
                            <div class="text-[10px] text-slate-400">${item.time}</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="text-right">
                                <div class="font-semibold text-emerald-400">${item.calories} kcal</div>
                                <div class="text-[10px] text-slate-400">蛋 ${item.protein}g</div>
                            </div>
                            <button onclick="deleteLog('${todayKey}', ${idx})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `).join('');
            document.getElementById('todayFoodLogs').innerHTML = logHTML;

            let favHTML = state.favorites.map(fav => `
                <div onclick="addLogItem('${fav.name}', ${fav.calories}, ${fav.protein})" class="glass-card rounded-xl p-3 min-w-[120px] flex-shrink-0 cursor-pointer hover:border-emerald-500 transition">
                    <div class="font-semibold text-xs text-white truncate">${fav.name}</div>
                    <div class="text-[10px] text-slate-400 mt-1">${fav.calories} kcal | ${fav.protein}g</div>
                </div>
            `).join('');
            document.getElementById('favoritesListContainer').innerHTML = favHTML;
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const r = new FileReader();
                r.onload = function(evt) {
                    state.currentImageBase64 = evt.target.result;
                    document.getElementById('imagePreview').src = evt.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('photoLabel').innerText = '已載入照片';
                };
                r.readAsDataURL(file);
            }
        }
        function clearImage() {
            state.currentImageBase64 = null;
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('photoLabel').innerText = '拍照 / 上傳食物';
        }

        async function analyzeFoodWithAI() {
            const desc = document.getElementById('aiDescription').value.trim();
            if (!desc && !state.currentImageBase64) {
                alert('請輸入描述或上傳照片！');
                return;
            }
            if (GEMINI_API_KEY.includes("在這裡貼上")) {
                alert('請記得在程式碼第 27 行填入您的 Gemini API Key！');
                return;
            }

            const btn = document.getElementById('aiAnalyzeBtn');
            btn.innerText = "分析中...";
            btn.disabled = true;

            try {
                let prompt = "分析以下食物，回傳 JSON：{\"name\": \"名稱\", \"calories\": 數字, \"protein\": 數字}";
                if (desc) prompt += ` 食物：${desc}`;

                let parts = [{ text: prompt }];
                if (state.currentImageBase64) {
                    parts.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: state.currentImageBase64.split(',')[1]
                        }
                    });
                }

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await res.json();
                let txt = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                let result = JSON.parse(txt);

                state.pendingAIFood = result;
                document.getElementById('aiResultContent').innerHTML = `
                    <div class="bg-slate-800 p-3 rounded-xl text-xs space-y-1">
                        <div class="font-bold text-white">${result.name}</div>
                        <div class="text-emerald-400">熱量：${result.calories} kcal</div>
                        <div class="text-cyan-400">蛋白質：${result.protein} g</div>
                    </div>
                `;
                openModal('aiResultModal');
            } catch(e) {
                alert('AI 分析失敗，請確認 API Key 是否正確及網路是否連線。');
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-bolt"></i><span>AI 計算熱量</span>`;
                btn.disabled = false;
            }
        }

        function confirmAddAIFood() {
            if(state.pendingAIFood) {
                addLogItem(state.pendingAIFood.name, state.pendingAIFood.calories, state.pendingAIFood.protein);
                closeModal('aiResultModal');
                document.getElementById('aiDescription').value = '';
                clearImage();
            }
        }

        function addLogItem(name, calories, protein) {
            if(!state.logs[todayKey]) state.logs[todayKey] = [];
            state.logs[todayKey].push({ name, calories, protein, time: new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'}) });
            saveToStorage();
            renderUI();
        }
        function deleteLog(dKey, idx) {
            state.logs[dKey].splice(idx, 1);
            saveToStorage();
            renderUI();
        }

        function saveSettings() {
            let w = parseFloat(document.getElementById('setWeight').value) || 65;
            let h = parseFloat(document.getElementById('setHeight').value) || 175;
            let a = parseFloat(document.getElementById('setAge').value) || 25;
            let g = document.getElementById('setGender').value;
            let act = parseFloat(document.getElementById('setActivity').value) || 1.55;

            let bmr = (10*w) + (6.25*h) - (5*a) + (g === 'male' ? 5 : -161);
            let tdee = Math.round(bmr * act);

            state.settings.targetCalories = tdee;
            state.settings.targetProtein = Math.round(w * 2);
            saveToStorage();
            renderUI();
            switchTab('today');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function renderHistoryChart() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            let labels = [], dataCal = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date(); d.setDate(d.getDate() - i);
                let k = d.toISOString().split('T')[0];
                labels.push(d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' }));
                dataCal.push((state.logs[k]||[]).reduce((s, x) => s + x.calories, 0));
            }
            if (window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ label: 'kcal', data: dataCal, backgroundColor: '#10b981' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
